<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0b1120" />
  <title>Nexus 2D</title>
  <style>
    :root {
      --bg: #0b1120;
      --panel: #111827;
      --panel-soft: #162033;
      --line: rgba(148, 163, 184, 0.18);
      --text: #f8fafc;
      --muted: #94a3b8;
      --primary: #38bdf8;
      --primary-2: #60a5fa;
      --accent: #fb7185;
      --success: #22c55e;
      --radius: 22px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 50% -20%, rgba(56,189,248,0.22), transparent 42%),
        linear-gradient(180deg, #0b1120 0%, #111827 100%);
      display: grid;
      place-items: center;
      padding: 18px;
      overflow-x: hidden;
      user-select: none;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .app-container {
      width: min(100%, 410px);
    }

    .card {
      width: 100%;
      background: rgba(17, 24, 39, 0.92);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 26px 20px 22px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.28);
      text-align: center;
      transform: translateZ(0);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 16px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.2);
      color: #86efac;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .7px;
      text-transform: uppercase;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--success);
    }

    h1 {
      margin-bottom: 8px;
      font-size: clamp(25px, 7vw, 34px);
      line-height: 1.05;
      font-weight: 900;
      letter-spacing: -0.8px;
    }

    .subtitle {
      margin-bottom: 22px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.55;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 14px;
    }

    input {
      width: 100%;
      height: 62px;
      padding: 0 18px;
      background: var(--panel-soft);
      border: 1px solid var(--line);
      border-radius: 18px;
      color: #fff;
      font-size: 24px;
      text-align: center;
      letter-spacing: 9px;
      font-weight: 850;
      outline: none;
      transition: border-color .18s ease, background-color .18s ease, box-shadow .18s ease;
    }

    input::placeholder {
      color: #64748b;
      letter-spacing: 3px;
      font-size: 14px;
      font-weight: 650;
    }

    input:focus {
      border-color: rgba(56,189,248,0.75);
      background: #17233a;
      box-shadow: 0 0 0 4px rgba(56,189,248,0.08);
    }

    button {
      width: 100%;
      height: 58px;
      border: 0;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #07111f;
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      cursor: pointer;
      transition: transform .15s ease, filter .15s ease, opacity .15s ease;
      will-change: transform;
    }

    button:active {
      transform: scale(.985);
    }

    button.loading {
      background: #263244;
      color: #9ca3af;
      pointer-events: none;
      opacity: .85;
    }

    .result-box {
      display: grid;
      grid-template-rows: 0fr;
      margin-top: 18px;
      opacity: 0;
      transition: grid-template-rows .24s ease, opacity .2s ease;
    }

    .result-box.show {
      grid-template-rows: 1fr;
      opacity: 1;
    }

    .result-inner {
      overflow: hidden;
      display: grid;
      gap: 10px;
    }

    .result-item {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 15px;
      background: rgba(15, 23, 42, .8);
      border: 1px solid var(--line);
      border-radius: 16px;
    }

    .result-item:nth-child(1) { --item: var(--primary); }
    .result-item:nth-child(2) { --item: var(--primary-2); }
    .result-item:nth-child(3) { --item: var(--accent); }

    .res-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      letter-spacing: .8px;
      text-transform: uppercase;
    }

    .res-value {
      color: var(--item);
      font-size: clamp(21px, 6vw, 27px);
      font-weight: 950;
      letter-spacing: 4px;
      font-variant-numeric: tabular-nums;
    }

    .hint {
      margin-top: 17px;
      color: #64748b;
      font-size: 11px;
      line-height: 1.6;
    }

    @media (max-width: 360px) {
      body { padding: 12px; }
      .card { padding: 22px 15px 18px; }
      input { letter-spacing: 7px; }
      .res-value { letter-spacing: 3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <main class="app-container">
    <section class="card">
      <div class="status-badge"><span class="status-dot"></span>Akses Aktif</div>
      <h1>Engine Poltar</h1>
      <p class="subtitle">Masukkan 4 digit result untuk ekstraksi cepat dan ringan.</p>

      <div class="input-wrap">
        <input type="number" id="res" placeholder="RESULT 4D" inputmode="numeric" autocomplete="off" oninput="limitInput(this)" />
      </div>

      <button id="btnCalc" onclick="processExtraction()">Ekstrak Data</button>

      <div class="result-box" id="result-box" aria-live="polite">
        <div class="result-inner">
          <div class="result-item">
            <span class="res-label">4D AI</span>
            <span class="res-value" id="out-4">0000</span>
          </div>
          <div class="result-item">
            <span class="res-label">6D CT</span>
            <span class="res-value" id="out-6">000000</span>
          </div>
          <div class="result-item">
            <span class="res-label">8D BBFS</span>
            <span class="res-value" id="out-8">00000000</span>
          </div>
        </div>
      </div>

      <p class="hint">UI dibuat lebih smooth, minim efek berat, dan tetap nyaman di HP.</p>
    </section>
  </main>

  <script>
    const mod10 = n => ((n % 10) + 10) % 10;
    const singleDigit = n => {
      while (n > 9) n = String(n).split('').reduce((a, b) => Number(a) + Number(b), 0);
      return n;
    };

    const ML = {0:1,1:0,2:5,3:8,4:7,5:2,6:9,7:4,8:3,9:6};
    const MB = {0:8,1:7,2:6,3:9,4:5,5:4,6:2,7:1,8:0,9:3};

    function limitInput(el) {
      el.value = el.value.replace(/\D/g, '').slice(0, 4);
    }

    function processExtraction() {
      const val = document.getElementById('res').value;
      if (val.length !== 4) {
        alert('Masukkan tepat 4 digit result!');
        return;
      }

      const btn = document.getElementById('btnCalc');
      const box = document.getElementById('result-box');
      box.classList.remove('show');
      btn.classList.add('loading');
      btn.textContent = 'Memproses...';

      window.setTimeout(() => {
        calculateAI();
        btn.classList.remove('loading');
        btn.textContent = 'Ekstrak Data';
        box.classList.add('show');
      }, 220);
    }

    function calculateAI() {
      const val = document.getElementById('res').value;
      const arr = val.split('').map(Number);
      const as = arr[0], kop = arr[1], kep = arr[2], ek = arr[3];
      const tgl = new Date().getDate();
      const votes = Array(10).fill(0);
      const addVote = nums => nums.forEach(num => votes[num]++);

      addVote([singleDigit(as+kop), mod10(singleDigit(as+kop)+1), mod10(singleDigit(as+kop)+2), mod10(singleDigit(as+kop)+3)]);
      addVote([Math.abs(kep-ek), mod10(Math.abs(kep-ek)-1), mod10(Math.abs(kep-ek)-2), mod10(Math.abs(kep-ek)-3)]);
      addVote([ek, mod10(ek+1), mod10(ek+5), mod10(mod10(ek+5)+1)]);

      const luar = singleDigit(as+ek), dalam = singleDigit(kop+kep);
      const set4 = Array.from(new Set([luar, dalam, mod10(luar+dalam), Math.abs(luar-dalam)]));
      while (set4.length < 4) {
        const nx = mod10(set4[set4.length - 1] + 1);
        if (!set4.includes(nx)) set4.push(nx);
      }
      addVote(set4.slice(0, 4));

      const f5 = singleDigit(as+kop+kep+ek);
      addVote([f5, mod10(f5+2), mod10(f5+4), mod10(f5+6)]);

      const f6 = mod10(as*ek);
      addVote([f6, mod10(f6+1), mod10(f6+2), mod10(f6+3)]);

      const qmSet = Array.from(new Set([kep, mod10(kep+5), ML[kep], MB[kep]]));
      while (qmSet.length < 4) {
        const nx2 = mod10(qmSet[qmSet.length - 1] + 1);
        if (!qmSet.includes(nx2)) qmSet.push(nx2);
      }
      addVote(qmSet.slice(0, 4));

      const pArr = [];
      let p = ek;
      for (let i = 0; i < 4; i++) {
        p = mod10(p + 2);
        pArr.push(p);
      }
      addVote(pArr);
      addVote([mod10(kep+2), mod10(ek+5), mod10(kep*ek), mod10(kep+ek+3)]);

      const f10 = singleDigit(kep+ek+tgl);
      addVote([f10, mod10(f10-1), mod10(f10-2), mod10(f10-3)]);

      const isGenapKep = kep % 2 === 0;
      const isGenapEk = ek % 2 === 0;
      const isKecilKep = kep < 5;
      const isKecilEk = ek < 5;
      const needGanjil = (isGenapKep && isGenapEk) ? true : ((!isGenapKep && !isGenapEk) ? false : null);
      const needBesar = (isKecilKep && isKecilEk) ? true : ((!isKecilKep && !isKecilEk) ? false : null);

      const hasilObj = [];
      for (let j = 0; j < 10; j++) {
        const isGanjil = j % 2 !== 0;
        const isBesar = j >= 5;
        let bonus = 0;
        if (needGanjil === true && isGanjil) bonus += .5;
        if (needGanjil === false && !isGanjil) bonus += .5;
        if (needBesar === true && isBesar) bonus += .5;
        if (needBesar === false && !isBesar) bonus += .5;
        hasilObj.push({ digit: j, totalScore: votes[j] + bonus });
      }

      hasilObj.sort((a, b) => b.totalScore - a.totalScore || b.digit - a.digit);
      const finalDigits = hasilObj.map(x => x.digit);
      const asc = nums => nums.sort((a,b) => a-b).join('');

      document.getElementById('out-4').textContent = asc(finalDigits.slice(0, 4));
      document.getElementById('out-6').textContent = asc(finalDigits.slice(0, 6));
      document.getElementById('out-8').textContent = asc(finalDigits.slice(0, 8));
    }
  </script>
</body>
</html>
